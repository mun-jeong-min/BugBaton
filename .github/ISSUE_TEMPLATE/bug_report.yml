name: Bug report
description: Report a reproducible BugBaton failure without exposing private browser data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BugBaton. Review every artifact before sharing it. Do not attach reports that contain private page content, screenshots, accessible names, URLs, or console prose.
  - type: input
    id: version
    attributes:
      label: BugBaton version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, Chrome version, and CDP protocol when known.
      placeholder: macOS 15, Node 22.19.0, Chrome 152, CDP 1.3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and a local fixture or public URL when safe.
      placeholder: |
        1. Run ...
        2. Reproduce ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual result
      description: Include the exit status and stable JSON error code when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed all pasted output and attachments for sensitive browser content.
          required: true
        - label: This report does not disclose a security vulnerability. I will use private vulnerability reporting for security issues.
          required: true
